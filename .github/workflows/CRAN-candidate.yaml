name: CRAN submission candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Build source tarball
        run: |
          R CMD build .
          sha256sum investlabr_*.tar.gz > SOURCE_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cran-source-${{ github.sha }}
          path: |
            investlabr_*.tar.gz
            SOURCE_SHA256.txt
          if-no-files-found: error

  check-devel:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      _R_CHECK_FORCE_SUGGESTS_: true
      NOT_CRAN: false
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-tinytex@v2
      - name: Install PDF manual fonts
        run: tlmgr install collection-fontsrecommended
      - name: Install HTML validation tool
        run: sudo apt-get install -y tidy
      - uses: actions/download-artifact@v4
        with:
          name: cran-source-${{ github.sha }}
          path: candidate
      - name: Verify source checksum
        working-directory: candidate
        run: sha256sum --check SOURCE_SHA256.txt
      - name: Check the exact submission tarball
        run: R CMD check --as-cran candidate/investlabr_*.tar.gz
      - name: Reject unexpected check notes
        run: |
          Rscript -e 'log <- readLines("investlabr.Rcheck/00check.log"); status <- grep("^Status:", log, value = TRUE); notes <- grep("^\\* checking .* \\.\\.\\. NOTE$", log, value = TRUE); if (length(status) != 1L || !identical(status, "Status: 1 NOTE") || length(notes) != 1L || !grepl("CRAN incoming feasibility", notes, fixed = TRUE)) stop("Unexpected R CMD check status; inspect 00check.log")'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cran-candidate-check-${{ github.sha }}
          path: investlabr.Rcheck/
          if-no-files-found: warn
