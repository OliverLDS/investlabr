id: macro-factor-heatmap
title: Macro Factor Exposure Heatmap
subtitle: Market controls separated from non-market macro and thematic exposures
summary: >
  A cross-sectional heatmap of standardized factor sensitivities for a tech,
  AI, and crypto-linked equity universe, with the economic story focused on
  non-market factors.
description_md: >
  This board keeps broad equity market factors as model controls while
  separating them from the main macro heatmap. The result is a cleaner view of
  rates, liquidity, volatility, reserve, and thematic exposures across a
  growth- and crypto-sensitive stock universe.
